# Static site. Runs as uid 101 with a read-only root filesystem: everything nginx writes goes under /tmp
# (an emptyDir in the cluster). TLS ends at the cluster's ingress; this listens on plain 8080.
worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  client_body_temp_path /tmp/body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  access_log /dev/stdout;
  server_tokens off;
  sendfile on;
  gzip on;
  gzip_types text/css application/javascript image/svg+xml;

  server {
    listen 8080;
    root /srv/site;
    index index.html;
    charset utf-8;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # /privacy and /terms work as well as /privacy.html and /terms.html.
    location / {
      try_files $uri $uri.html $uri/ =404;
    }
  }
}
